[workspace]
authors = ["pedriniedoardo <pedrini.edoardo@gmail.com>"]
channels = ["conda-forge"]
name = "test_R45_velocyto"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
r-base = ">=4.5.2,<4.6"
libxml2 = ">=2.15.1,<3"
icu = ">=75.1,<76"
boost-cpp = ">=1.85.0,<2"
cmake = ">=4.3.2,<5"
pkg-config = ">=0.29.2,<0.30"
libcurl = ">=8.20.0,<9"
openssl = ">=3.6.2,<4"
hdf5 = ">=2.1.0,<3"
glpk = ">=5.0,<6"
fftw = ">=3.3.11,<4"
gdal = ">=3.13.0,<4"
geos = ">=3.14.1,<4"
proj = ">=9.8.1,<10"
python = ">=3.14.4,<3.15"
pip = ">=26.1.1,<27"
leidenalg = ">=0.11.0,<0.12"
umap-learn = ">=0.5.12,<0.6"
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
fortran-compiler = ">=1.11.0,<2"
make = ">=4.4.1,<5"
zlib = ">=1.3.2,<2"
cairo = ">=1.18.4,<2"
imagemagick = ">=7.1.2_16,<8"
freetype = ">=2.14.3,<3"
fontconfig = ">=2.17.1,<3"
libarrow = ">=24.0.0,<25"
libarrow-acero = ">=24.0.0,<25"
libarrow-compute = ">=24.0.0,<25"
libarrow-dataset = ">=24.0.0,<25"
libarrow-substrait = ">=24.0.0,<25"
libparquet = ">=24.0.0,<25"
udunits2 = ">=2.2.28,<3"
sqlite = ">=3.53.1,<4"
gmp = ">=6.3.0,<7"

[activation.env]
LIBARROW_BINARY = "FALSE"
NOT_CRAN = "true"
ARROW_HOME = "$CONDA_PREFIX"
R_MAKEVARS_USER = "$PIXI_PROJECT_ROOT/.R/Makevars"
